name: API Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/api/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wimmer
          POSTGRES_PASSWORD: wimmer
          POSTGRES_DB: wimmer_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          DATABASE_URL: "postgresql+psycopg2://wimmer:wimmer@localhost:5432/wimmer_test"
          SECRET_KEY: "test-secret-key-for-ci-only"
          LLM_PROVIDER: "mock"
          ENVIRONMENT: "development"
        run: pytest tests/ -v --cov=wimmer --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          fail_ci_if_error: false
